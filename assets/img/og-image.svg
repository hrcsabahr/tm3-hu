<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFAF7"/>
      <stop offset="100%" stop-color="#F4F3EF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0075DE"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo mark -->
  <rect x="80" y="80" width="80" height="80" rx="18" fill="url(#accent)"/>
  <text x="120" y="138" font-family="Inter, sans-serif" font-size="44" font-weight="700" fill="white" text-anchor="middle">M3</text>

  <!-- Brand -->
  <text x="180" y="138" font-family="Inter, sans-serif" font-size="36" font-weight="600" fill="#1A1A1A">tm3.hu</text>

  <!-- Main headline -->
  <text x="80" y="320" font-family="Fraunces, Georgia, serif" font-size="84" font-weight="500" fill="#1A1A1A" letter-spacing="-2">
    <tspan x="80">Tesla Model 3</tspan>
    <tspan x="80" dy="92">minden, amit tudni</tspan>
    <tspan x="80" dy="92" fill="#0075DE" font-style="italic">érdemes.</tspan>
  </text>

  <!-- Sub -->
  <text x="80" y="565" font-family="Inter, sans-serif" font-size="22" font-weight="400" fill="#525252">
    Magyar tudásbázis · Kalkulátorok · Szervizek · Töltők
  </text>

  <!-- Decorative accent bar -->
  <rect x="80" y="240" width="120" height="6" rx="3" fill="url(#accent)"/>
</svg>
