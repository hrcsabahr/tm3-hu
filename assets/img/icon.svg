<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0a84ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Háttér -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Belső keret -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="none"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Felső akcent vonal -->
  <line x1="96" y1="160" x2="416" y2="160" stroke="url(#line)" stroke-width="2"/>

  <!-- "M3" szöveg -->
  <text x="256" y="305" font-family="Inter, -apple-system, sans-serif"
        font-size="220" font-weight="800" fill="#ffffff"
        text-anchor="middle" letter-spacing="-8">M3</text>

  <!-- Alsó akcent vonal -->
  <line x1="96" y1="360" x2="416" y2="360" stroke="url(#line)" stroke-width="2"/>

  <!-- "tm3.hu" alcím -->
  <text x="256" y="412" font-family="Inter, -apple-system, sans-serif"
        font-size="36" font-weight="500" fill="#0a84ff"
        text-anchor="middle" letter-spacing="2">tm3.hu</text>
</svg>
